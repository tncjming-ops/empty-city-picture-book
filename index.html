*{box-sizing:border-box}body{margin:0;background:#1e2c37;color:#293b3d;font-family:"Microsoft JhengHei",sans-serif}header{text-align:center;color:#f8edce;padding:24px 12px 12px}header p{color:#d9c9a0;margin:5px}.book{max-width:1100px;margin:auto;padding:0 18px 30px}.page{background:#f9f1df;border-radius:12px;overflow:hidden;box-shadow:0 16px 45px #0006;display:grid;grid-template-columns:1fr 1fr;min-height:440px}.picture{background-image:url("story.png");background-size:500% 200%;background-repeat:no-repeat;aspect-ratio:1}.words{padding:clamp(25px,4vw,55px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#aa6a43;letter-spacing:.15em;font-weight:bold}.words h2{font-size:clamp(24px,3vw,38px);margin:15px 0}.words p{font-size:clamp(19px,2vw,25px);line-height:1.9;margin:0}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px;color:#fff}button{font:inherit;background:#f4e5c3;border:0;border-radius:30px;padding:10px 20px;color:#273c42;cursor:pointer}button:hover{background:white}.count{min-width:75px;text-align:center}details{background:#f9f1df;border-radius:12px;padding:20px;margin-top:8px}summary{cursor:pointer;font-weight:bold;font-size:20px}details img{display:block;width:100%;margin-top:15px}footer{text-align:center;color:#d6c9ac;line-height:1.7;padding:15px}.progress{height:4px;background:#d1bc94}.progress span{display:block;height:100%;background:#b96e48;transition:width .3s}@media(max-width:700px){.page{display:block}.picture{min-height:0;aspect-ratio:1}.words{min-height:245px}.words p{font-size:19px}header h1{font-size:25px}}
</style></head><body><header><p>智慧故事繪本</p><h1>城樓上的琴聲——空城計</h1><p>冷靜思考，運用智慧化解危機</p></header><main class="book"><article class="page"><div id="picture" class="picture" role="img"></div><div class="words"><span class="eyebrow" id="chapter"></span><h2 id="title"></h2><p id="story" aria-live="polite"></p></div></article><div class="progress"><span id="bar"></span></div><nav class="controls" aria-label="繪本播放控制"><button id="prev">上一頁</button><button id="toggle">開始播放旁白</button><button id="next">下一頁</button><span class="count" id="count"></span></nav><p id="audioStatus" role="status" style="text-align:center;color:#f8edce;margin:0 0 18px">點選「開始播放旁白」，跟著故事一起聆聽。</p><audio id="narration" preload="metadata"></audio><details><summary>認識故事角色：三視角設定圖</summary><p>上排：諸葛亮；下排：司馬懿。依序呈現正面、側面與背面。</p><img src="characters.png" alt="諸葛亮與司馬懿的正面、側面及背面角色設定圖"></details><footer>依《空城計》課文與提供的故事腳本改編，供教學閱讀。<br>本故事取材自《三國演義》，屬文學演義。</footer></main><script>
const pages=[
['起','兵力空虛','重地街亭失守後，孔明立刻調度兵馬，自己帶領五千名士兵前往西城縣搬運糧草。沒想到軍隊剛分派出去，城裡只剩下二千五百名守軍，連一名大將也沒有。'],
['起','大軍來襲','忽然，十幾名探子飛馬趕來報告：「大事不好！司馬懿親自率領十五萬大軍，正朝著西城縣蜂擁殺來！」眾人聽見消息，全都嚇得臉色發白、驚慌失措。'],
['承','臨危思策','孔明登上城樓遠望，只見遠方塵土飛揚、遮天蔽日，魏國大軍正分作兩路逼近。眼看逃也逃不掉，戰也戰不過，孔明深吸一口氣，心中有了主意。'],
['承','大開城門','孔明立刻下令，把城上所有的旗幟通通藏起來，士兵們必須安靜守在崗位上，不准隨意走動或喧鬧。接著，他竟然命令士兵把四座城門全部打開！'],
['承','城樓上的琴聲','每座城門邊，各有二十名士兵換上百姓的衣服，低頭安靜地打掃街道。孔明則披上外衣、戴好頭巾，帶著兩名小書僮與一張古琴，端坐在城樓上薰香彈琴。'],
['轉','疑雲重重','不久，司馬懿的先鋒部隊衝到城門外，看見大門敞開、琴聲悠揚的奇特景象，嚇得不敢前進，急忙回報。司馬懿笑著不信，親自騎著快馬來到城前一探究竟。'],
['轉','琴聲中的試探','司馬懿親眼看見孔明笑容滿面地彈琴，左右站著書僮，城門口還有百姓低頭灑掃，完全旁若無人。悠揚的琴聲在風中迴盪，司馬懿的心裡卻越聽越發毛。'],
['轉','下令撤軍','司馬懿回到軍中，立刻下令全軍朝北方山路撤退。兒子司馬昭不解地問：「父親為何輕易退兵？」司馬懿說：「孔明平生謹慎，如今城門大開，一定設有重重埋伏！」'],
['合','危機解除','魏國十五萬大軍就這樣浩浩蕩蕩地退走了。孔明見敵軍遠去，這才撫掌大笑。城裡的官兵們驚魂未定，紛紛圍上前來，佩服地稱讚丞相真是神機妙算。'],
['合','智慧的答案','孔明笑著向眾人解釋：「我只有兩千五百名士兵，逃也逃不遠，只好利用司馬懿多疑的個性設下空城計。但若換作我是司馬懿，可不會這麼輕率退兵呢！」']];
let index=0,playing=false,finished=false,timer;const $=id=>document.getElementById(id),audio=$('narration');
function render(){const [part,title,story]=pages[index];$('chapter').textContent='第 '+(index+1)+' 頁 ・ '+part;$('title').textContent=title;$('story').textContent=story;$('picture').style.backgroundPosition=(index%5*25)+'% '+(index<5?0:100)+'%';$('picture').setAttribute('aria-label',title+'的故事插畫');$('count').textContent=(index+1)+' / 10';$('bar').style.width=((index+1)*10)+'%';$('toggle').textContent=playing?'暫停播放':finished?'重新播放':'開始／繼續播放'}
function loadPage(){clearTimeout(timer);audio.pause();audio.src='audio/'+String(index+1).padStart(2,'0')+'.mp3';audio.load();render();if(playing)playAudio()}
function playAudio(){audio.play().then(()=>{$('audioStatus').textContent='旁白播放中；每頁朗讀完畢後自動翻頁。'}).catch(()=>{playing=false;render();$('audioStatus').textContent='請點選「開始／繼續播放」啟動旁白。'})}
audio.addEventListener('ended',()=>{if(!playing)return;if(index===pages.length-1){playing=false;finished=true;render();$('audioStatus').textContent='故事播放完畢。';return}timer=setTimeout(()=>{index++;loadPage()},1000)});
audio.addEventListener('error',()=>{playing=false;clearTimeout(timer);render();$('audioStatus').textContent='旁白載入失敗，請檢查網路後重新播放。'});
$('prev').onclick=()=>{index=Math.max(0,index-1);finished=false;loadPage()};$('next').onclick=()=>{index=Math.min(9,index+1);finished=false;loadPage()};$('toggle').onclick=()=>{if(playing){playing=false;clearTimeout(timer);audio.pause();$('audioStatus').textContent='已暫停旁白與翻頁。';render()}else{if(finished){index=0;finished=false;playing=true;loadPage()}else{playing=true;render();if(audio.ended){index=Math.min(index+1,9);loadPage()}else playAudio()}}};loadPage();
</script></body></html>
